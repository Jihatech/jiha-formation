name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Contenu JIHA-Learn requis par les vérifications ci-dessous.
      - name: Sync content
        run: pnpm sync:content

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Preuve automatique : un guide mal formé ou un quiz désaligné
      # fait échouer la CI au lieu d'être découvert en prod.
      - name: Check parser
        run: pnpm check:parser

      - name: Check quizzes
        run: pnpm check:quizzes

      # Informatif en CI (non bloquant). Bloquant à la mise en service :
      # pnpm check:legal --strict (cf. skill mise-en-prod).
      - name: Check legal
        run: pnpm check:legal

      # `prebuild` synchronise le contenu depuis JIHA-Learn (réseau requis).
      # Aucune variable Supabase nécessaire au build (lecture paresseuse).
      - name: Build
        run: pnpm build
